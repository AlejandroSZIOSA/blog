<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Details</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/details.css" />
  </head>
  <body>
    <header>
      <button id="backBtn">Back</button>
    </header>
    <main>
      <div id="messages"></div>
      <div id="content">
        <h2>Details</h2>

        <section class="blog-info__section">
          <div>
            <h2 id="postTitle"></h2>
            <p id="postDescription"></p>
            <div>
              <button id="editBtn">Edit</button>
              <button id="deleteBtn">Delete</button>
            </div>
          </div>

          <div id="editPostSection">
            <form id="editPostForm">
              <fieldset>
                <legend>Edit Blog</legend>
                <label>Title</label>
                <input type="text" id="editPostTitleInput" name="title" /><br />
                <label>Content</label>
                <textarea type="text" id="editPostContentTextArea" name="body">
                </textarea
                ><br />
                <br />
                <div
                  id="innerEditPostErrorMsg"
                  class="innerPageErrorMsgDiv"
                ></div>
                <button id="saveChangesBtn" type="submit">Save Changes</button>
              </fieldset>
            </form>
          </div>
        </section>

        <section class="add-comment__section">
          <form id="commentForm">
            <fieldset>
              <legend>Add A Comment</legend>
              <textarea type="text" id="newComment" name="newComment">
              </textarea>
              <br />
              <div
                id="innerAddCommentErrorMsg"
                class="innerPageErrorMsgDiv"
              ></div>
              <button type="submit">Add</button>
            </fieldset>
          </form>
        </section>

        <section>
          <h2>Comments</h2>
          <ol id="commentList"></ol>
        </section>
      </div>
    </main>
    <script src="../js/details.js"></script>
  </body>
</html>
