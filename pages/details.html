<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="details.css" />
    <title>Details</title>
  </head>
  <body>
    <header>
      <button id="backBtn">Back</button>
    </header>
    <main>
      <div id="messages"></div>
      <div id="content">
        <section>
          <h2>Blog Details</h2>
          <h3 id="postTitle"></h3>
          <p id="postDescription"></p>
          <div>
            <button id="editBtn">Edit</button>
            <button id="deleteBtn">Delete</button>
          </div>
        </section>

        <section id="editPostSection">
          <form id="editPostForm">
            <fieldset>
              <legend>Edit Blog</legend>
              <label>Title</label>
              <input type="text" id="editPostTitleInput" name="title" /><br />

              <label>Content</label>
              <textarea type="text" id="editPostContentTextArea" name="body">
              </textarea
              ><br />
              <br />
              <button id="saveChangesBtn" type="submit">Save Changes</button>
            </fieldset>
          </form>
        </section>

        <section>
          <form id="commentForm">
            <fieldset>
              <legend>Add A Comment</legend>
              <label for="newComment" name="newComment">Comment</label>
              <textarea type="text" id="newComment" name="newComment">
              </textarea>
              <br />
              <button type="submit">Add</button>
            </fieldset>
          </form>
        </section>

        <section>
          <h2>Comments</h2>

          <ol id="commentList">
            <!--  <li id="commentItem">
              <h3 id="userName"></h3>
              <p id="userComment"></p>
            </li> -->
          </ol>
        </section>
      </div>
    </main>
    <script src="details.js"></script>
  </body>
</html>
